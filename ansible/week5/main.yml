---

- name: Gather Ansible Facts
  hosts: cs320
  remote_user: egregg
  
  tasks:
    - name: Execute the LAMP Role
      ansible.builtin.include_role:
        name: lamp
    
    - name: Include the App role
      ansible.builtin.include_role:
        name: app

  tasks:
    - name: Reboot the Linux server after deployment completes
      ansible.builtin.reboot:
        msg: "Ansible is rebooting the server to finalize the LAMP stack deployment." 
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      become: true  

